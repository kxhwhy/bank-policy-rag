[mysql]
host = 127.0.0.1
port = 3306
user = root
password =
database = bank_policy

[redis]
host = 127.0.0.1
port = 6379
password =
# 用独立的 db 与 Milvus 元数据所在 db0 隔离，避免键空间互相干扰
db = 3
# 问答缓存有效期（秒）
cache_ttl = 86400

[milvus]
uri = http://127.0.0.1:19530
database = bank_policy
collection = policy_clause

[embedding]
model_name = BAAI/bge-m3
# 仅离线自测时置 true；生产环境必须为 false，否则召回质量会严重下降
allow_hash_fallback = false

[llm]
model = deepseek-chat
# 密钥从环境变量 POLICY_LLM_API_KEY 注入，不要把 key 写到本文件里
api_key =
base_url = https://api.deepseek.com/v1
temperature = 0.1

[chunk]
parent_max_chars = 1200
child_chunk_size = 300
child_overlap = 60

[retrieval]
top_k = 8
final_top_m = 3
dense_weight = 0.7
sparse_weight = 0.3
min_similarity = 0.35
enable_query_rewrite = true
# 交叉编码器重排：召回候选按"能否回答该问题"重新打分
enable_rerank = true
rerank_model_path = models/bge-reranker-large
rerank_top_m = 3

[app]
business_lines = 个人信贷,反洗钱,运营柜面
